<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Restricted</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }

        .error-container {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 500px;
        }

        .error-code {
            font-size: 72px;
            font-weight: bold;
            color: #dc3545;
            margin-bottom: 10px;
        }

        .error-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .error-message {
            font-size: 15px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .btn-home {
            display: inline-block;
            padding: 12px 24px;
            background: #0d6efd;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            transition: 0.3s;
        }

        .btn-home:hover {
            background: #0b5ed7;
        }
    </style>
</head>
<body>

    <div class="error-container">
        <div class="error-code">403</div>

        <div class="error-title">
            Unable to Access Resource
        </div>

        <div class="error-message">
            The requested page or network resource cannot be reached at this time.
            You may not have permission to access this directory or the resource is unavailable.
        </div>

        <a href="/" class="btn-home">
            Return to Homepage
        </a>
    </div>

</body>
</html>
